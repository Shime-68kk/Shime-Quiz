name: Playwright E2E Smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Pin stable npm
        run: |
          npm install -g npm@9.9.4
          npm --version

      - name: Guard public npm registry
        run: |
          ! grep -R "applied-caas\|artifactory\|internal.api.openai\|packages.applied" package-lock.json package.json .npmrc 2>/dev/null
          npm config set registry https://registry.npmjs.org/
          npm config get registry

      - name: Install dependencies
        timeout-minutes: 20
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -e
          npm ci --include=dev --ignore-scripts --no-audit --no-fund --progress=false --loglevel=notice || {
            echo "npm ci failed; retrying once with npm install fallback"
            find "$HOME/.npm/_logs" -type f -name "*debug*.log" -print -exec tail -80 {} \; || true
            rm -rf node_modules
            npm install --include=dev --ignore-scripts --no-audit --no-fund --progress=false --loglevel=notice
          }

      - name: Verify installed tooling
        run: |
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/vitest

      # Phase 25H validator retained as historical reference; not run as Phase 25I merge-blocking gate.
      # node scripts/validate-phase25h-backup-health-persistence-signal-design.js

      # Phase 25I validator retained as historical reference; not run as Phase 25J merge-blocking gate.
      # node scripts/validate-phase25i-backup-health-thin-read-only-signal-layer.js

      # Phase 25J validator retained as historical reference; not run as Phase 25K merge-blocking gate.
      # node scripts/validate-phase25j-backup-health-read-only-integration-design-gate.js

      # Phase 25K validator retained as historical reference; not run as Phase 25L merge-blocking gate.
      # node scripts/validate-phase25k-backup-health-test-only-default-off-integration-prototype.js

      # Phase 25L validator retained as historical reference; not run as Phase 25M merge-blocking gate.
      # node scripts/validate-phase25l-backup-health-production-ui-design-gate.js

      # Phase 25M validator retained as historical reference; not run as Phase 25N merge-blocking gate.
      # node scripts/validate-phase25m-backup-health-limited-default-off-ui-prototype.js

      # Phase 25N validator retained as historical reference; not run as Phase 26A merge-blocking gate.
      # node scripts/validate-phase25n-backup-health-evidence-closure-gate.js

      # Phase 26A validator retained as historical reference; not run as Phase 26B merge-blocking gate.
      # node scripts/validate-phase26a-local-first-hybrid-readiness-direction.js

      - name: Fetch origin main for Phase 26B validator
        run: git fetch origin refs/heads/main:refs/remotes/origin/main --prune

      - name: Validate Phase 26B Local-First Hybrid Evidence Re-Decision
        run: node scripts/validate-phase26b-local-first-hybrid-evidence-redecision.js

      - name: Build app
        run: npm run build

      - name: Run Vitest unit tests
        run: npm run test:unit

      - name: Validate smoke fixture
        run: node scripts/validate-smoke-fixture.js

      # Historical Phase 15/16 audit references retained for legacy workflow-registration tests.
      # These are intentionally not run by the default e2e-smoke PR gate.
      # node scripts/validate-phase15e-controlled-internal-activation-harness.js
      # node scripts/validate-phase15f-studyroom-copy-ux-alignment.js
      # node scripts/validate-phase15h-fsrs-foundation-closure-phase16-readiness.js
      # node scripts/validate-phase16a-vietnamese-first-ux-copy-alignment.js
      # node scripts/validate-phase16b-hybrid-local-first-optional-sync-direction.js
      # node scripts/validate-phase16c-storage-large-import-edugen-risk-audit.js
      # node scripts/validate-phase16d-shime-study-identity-product-principles.js
      # node scripts/validate-phase16e-visual-polish-quick-wins.js
      # node scripts/validate-phase16f-edugen-draft-workshop-connector-foundation.js
      # node scripts/validate-phase16g-edugen-draft-review-import-flow.js
      # node scripts/validate-phase16h-edugen-draft-quality-review-source-aware-library.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke
        run: npm run test:e2e:smoke

      - name: Run onboarding E2E smoke
        run: npm run test:e2e:onboarding

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
