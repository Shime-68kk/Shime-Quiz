name: Playwright E2E Smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Validate smoke fixture
        run: node scripts/validate-smoke-fixture.js

      - name: Validate v2 release hardening
        run: node scripts/validate-v2-release-hardening.js

      - name: Validate exam readiness
        run: node scripts/validate-exam-readiness.js

      - name: Validate recommendation feedback
        run: node scripts/validate-recommendation-feedback.js

      - name: Validate weighted selection
        run: node scripts/validate-weighted-selection.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
