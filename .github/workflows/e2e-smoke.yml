name: Playwright E2E Smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Validate smoke fixture
        run: node scripts/validate-smoke-fixture.js

      - name: Validate v2 release hardening
        run: node scripts/validate-v2-release-hardening.js

      - name: Validate exam readiness
        run: node scripts/validate-exam-readiness.js

      - name: Validate recommendation feedback
        run: node scripts/validate-recommendation-feedback.js

      - name: Validate weighted selection
        run: node scripts/validate-weighted-selection.js

      - name: Validate storage sync
        run: node scripts/validate-storage-sync.js

      - name: Validate import validation
        run: node scripts/validate-import-validation.js

      - name: Validate dashboard performance
        run: node scripts/validate-dashboard-performance.js

      - name: Validate dashboard plan completion guard
        run: node scripts/validate-dashboard-plan-completion-guard.js

      - name: Validate backup restore recovery
        run: node scripts/validate-backup-restore-recovery.js

      - name: Validate text quiz parser
        run: node scripts/validate-text-quiz-parser.js

      - name: Validate text file import
        run: node scripts/validate-text-file-import.js

      - name: Validate EduGen PDF integration
        run: node scripts/validate-edugen-pdf-integration.js

      - name: Validate EduGen document integration
        run: node scripts/validate-edugen-document-integration.js

      - name: Validate quiz draft quality
        run: node scripts/validate-quiz-draft-quality.js

      - name: Validate import UX release readiness
        run: node scripts/validate-import-ux-release-readiness.js

      - name: Validate AI planning docs
        run: node scripts/validate-ai-planning-docs.js

      - name: Validate AI prompt export
        run: node scripts/validate-ai-prompt-export.js

      - name: Validate AI output import hardening
        run: node scripts/validate-ai-output-import-hardening.js

      - name: Validate AI integration readiness
        run: node scripts/validate-ai-integration-readiness.js

      - name: Validate AI draft evaluation fixtures
        run: node scripts/validate-ai-draft-evaluation-fixtures.js

      - name: Validate release candidate status
        run: node scripts/validate-release-candidate-status.js

      - name: Validate public release docs
        run: node scripts/validate-public-release-docs.js

      - name: Validate demo readiness docs
        run: node scripts/validate-demo-readiness-docs.js

      - name: Validate demo sample pack
        run: node scripts/validate-demo-sample-pack.js

      - name: Validate visual asset guidance
        run: node scripts/validate-visual-asset-guidance.js

      - name: Validate demo sample quickstart
        run: node scripts/validate-demo-sample-quickstart.js

      - name: Validate demo quickstart onboarding
        run: node scripts/validate-demo-quickstart-onboarding.js

      - name: Validate Library empty-state onboarding
        run: node scripts/validate-library-empty-state-onboarding.js

      - name: Validate Dashboard first-run onboarding
        run: node scripts/validate-dashboard-first-run-onboarding.js

      - name: Validate public positioning lock
        run: node scripts/validate-public-positioning-lock.js

      - name: Validate onboarding E2E smoke coverage
        run: node scripts/validate-onboarding-e2e-smoke.js

      - name: Validate local E2E verification docs
        run: node scripts/validate-local-e2e-verification-docs.js

      - name: Validate final RC audit
        run: node scripts/validate-final-rc-audit.js

      - name: Validate CI green verification docs
        run: node scripts/validate-ci-green-verification.js

      - name: Validate release tag decision
        run: node scripts/validate-release-tag-decision.js

      - name: Validate GitHub release draft
        run: node scripts/validate-github-release-draft.js

      - name: Validate release package cleanliness
        run: node scripts/validate-release-package-cleanliness.js

      - name: Validate release tag publish checklist
        run: node scripts/validate-release-tag-publish-checklist.js

      - name: Validate import regression smoke
        run: node scripts/validate-import-regression-smoke.js

      - name: Validate backup restore regression smoke
        run: node scripts/validate-backup-restore-regression-smoke.js

      - name: Validate Study Room Dashboard regression smoke
        run: node scripts/validate-study-dashboard-regression-smoke.js

      - name: Validate accessibility keyboard smoke
        run: node scripts/validate-accessibility-keyboard-smoke.js

      - name: Validate public landing page
        run: node scripts/validate-public-landing-page.js

      - name: Validate social preview metadata
        run: node scripts/validate-social-preview-metadata.js

      - name: Validate direct route SPA fallback
        run: node scripts/validate-direct-route-spa-fallback.js

      - name: Validate screenshot asset pack
        run: node scripts/validate-screenshot-asset-pack.js

      - name: Validate README public-facing guide
        run: node scripts/validate-readme-public-facing.js

      - name: Validate performance bundle audit
        run: node scripts/validate-performance-bundle-audit.js

      - name: Validate mobile UX smoke
        run: node scripts/validate-mobile-ux-smoke.js

      - name: Validate EduGen boundary polish
        run: node scripts/validate-edugen-boundary-polish.js

      - name: Validate cross-device export import
        run: node scripts/validate-cross-device-export-import.js

      - name: Validate final public release readiness re-audit
        run: node scripts/validate-final-public-release-readiness-reaudit.js

      - name: Validate release candidate tag publish gate
        run: node scripts/validate-release-candidate-tag-publish-gate.js

      - name: Validate manual evidence run pack
        run: node scripts/validate-manual-evidence-run-pack.js

      - name: Validate release tag creation plan
        run: node scripts/validate-release-tag-creation-plan.js

      - name: Validate GitHub Release publication plan
        run: node scripts/validate-github-release-publication-plan.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke
        run: npm run test:e2e:smoke

      - name: Run onboarding E2E smoke
        run: npm run test:e2e:onboarding

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Validate release package assembly plan
        run: node scripts/validate-release-package-assembly-plan.js

      - name: Validate final release execution checklist
        run: node scripts/validate-final-release-execution-checklist.js

      - name: Validate final main release authorization
        run: node scripts/validate-final-main-release-authorization.js

      - name: Validate release candidate freeze final decision
        run: node scripts/validate-release-candidate-freeze-final-decision.js

      - name: Validate manual evidence results log
        run: node scripts/validate-manual-evidence-results-log.js

      - name: Validate manual evidence execution checklist
        run: node scripts/validate-manual-evidence-execution-checklist.js

      - name: Validate cross-device transfer UX decision
        run: node scripts/validate-cross-device-transfer-ux-decision.js

      - name: Validate cross-device transfer UX copy polish
        run: node scripts/validate-cross-device-transfer-ux-copy.js

      - name: Validate backup transfer safety hardening
        run: node scripts/validate-backup-transfer-safety-hardening.js

      - name: Validate Web Share mobile sharing prototype plan
        run: node scripts/validate-web-share-mobile-sharing-prototype-plan.js

      - name: Validate Web Share runtime prototype
        run: node scripts/validate-web-share-runtime-prototype.js
