name: Playwright E2E Smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Pin stable npm
        run: |
          npm install -g npm@9.9.4
          npm --version

      - name: Guard public npm registry
        run: |
          ! grep -R "applied-caas\|artifactory\|internal.api.openai\|packages.applied" package-lock.json package.json .npmrc 2>/dev/null
          npm config set registry https://registry.npmjs.org/
          npm config get registry

      - name: Install dependencies
        timeout-minutes: 20
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -e
          npm ci --include=dev --ignore-scripts --no-audit --no-fund --progress=false --loglevel=notice || {
            echo "npm ci failed; retrying once with npm install fallback"
            find "$HOME/.npm/_logs" -type f -name "*debug*.log" -print -exec tail -80 {} \; || true
            rm -rf node_modules
            npm install --include=dev --ignore-scripts --no-audit --no-fund --progress=false --loglevel=notice
          }

      - name: Verify installed tooling
        run: |
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/vitest

      # Phase 35P validator retained as historical reference; not run as Phase 36 merge-blocking gate.
      # Validate Phase 35P Core UI Plan Completion Review
      # node scripts/validate-phase35p-core-ui-plan-completion-review.js
      # Phase 35O validator retained as historical reference; not run as Phase 36 merge-blocking gate.
      # Validate Phase 35O Study Room Answer Feedback Polish Evidence Review
      # node scripts/validate-phase35o-study-room-answer-feedback-polish-evidence-review.js
      # Phase 35N validator retained as historical reference; not run as Phase 36 merge-blocking gate.
      # Validate Phase 35N Study Room Answer Feedback Polish
      # node scripts/validate-phase35n-study-room-answer-feedback-polish.js
      # Phase 35M validator retained as historical reference; not run as Phase 36 merge-blocking gate.
      # node scripts/validate-phase35m-next-ui-polish-scope.js
      # Phase 35K validator retained as historical reference from earlier UI polish gates; not run here.
      # Validate Phase 35K Elastic Button Compression Pilot
      # node scripts/validate-phase35k-elastic-button-compression-pilot.js
      # Phase 35J validator retained as historical reference from the Phase 35K gate; not run here.

      # Phase 36 validator retained as historical reference; not run as Phase 36A merge-blocking gate.
      # Validate Phase 36 UI Polish Backlog Review
      # node scripts/validate-phase36-ui-polish-backlog-review.js

      # Phase 36A validator retained as historical reference; not run as Phase 36B merge-blocking gate.
      # Validate Phase 36A Mobile Touch Polish Scope Gate
      # node scripts/validate-phase36a-mobile-touch-polish-scope.js

      # Phase 36B validator retained as historical reference; not run as Phase 36C merge-blocking gate.
      # Validate Phase 36B Bottom Navigation Touch Comfort and Safe-Area Pilot
      # node scripts/validate-phase36b-bottom-nav-touch-comfort-safe-area-pilot.js

      # Phase 36C validator retained as historical reference; not run as Phase 36D merge-blocking gate.
      # Validate Phase 36C Bottom Navigation Touch Comfort and Safe-Area Pilot Evidence Review
      # node scripts/validate-phase36c-bottom-nav-touch-comfort-safe-area-pilot-evidence-review.js

      # Phase 36D validator retained as historical reference; not run as Phase 36E merge-blocking gate.
      # Validate Phase 36D Mobile Touch Follow-up and Library Tabs Touch/Focus Scope Gate
      # node scripts/validate-phase36d-mobile-touch-library-tabs-scope.js

      # Phase 36E validator retained as historical reference; not run as Phase 36F merge-blocking gate.
      # Validate Phase 36E Library Mobile Tabs Touch and Focus Pilot
      # node scripts/validate-phase36e-library-mobile-tabs-touch-focus-pilot.js

      # Phase 36F validator retained as historical reference; not run as Phase 36G merge-blocking gate.
      # Validate Phase 36F Library Mobile Tabs Touch and Focus Pilot Evidence Review
      # node scripts/validate-phase36f-library-mobile-tabs-touch-focus-pilot-evidence-review.js

      # Phase 36G validator retained as historical reference; not run as Phase 36H merge-blocking gate.
      # Validate Phase 36G Mobile/Accessibility Track Completion and Focus Scope Gate
      # node scripts/validate-phase36g-mobile-accessibility-track-focus-scope.js

      # Phase 36H validator retained as historical reference; not run as Phase 36I merge-blocking gate.
      # Validate Phase 36H Core Interactive Focus Visible Consistency Pilot
      # node scripts/validate-phase36h-core-interactive-focus-visible-consistency-pilot.js

      # Phase 36I validator retained as historical reference; not run as Phase 36J merge-blocking gate.
      # Validate Phase 36I Core Interactive Focus Visible Consistency Pilot Evidence Review
      # node scripts/validate-phase36i-core-interactive-focus-visible-consistency-pilot-evidence-review.js

      # Phase 36J validator retained as historical reference; not run as Phase 37 merge-blocking gate.
      # Validate Phase 36J Mobile/Accessibility Track Completion Review
      # node scripts/validate-phase36j-mobile-accessibility-track-completion-review.js

      # Phase 37 validator retained as historical reference; not run as Phase 37A merge-blocking gate.
      # Validate Phase 37 Backlog or Limited Release Readiness Review
      # node scripts/validate-phase37-backlog-or-limited-release-readiness-review.js

      # Phase 37A validator retained as historical reference; not run as Phase 37B merge-blocking gate.
      # Validate Phase 37A Broader Actual Evidence Run
      # node scripts/validate-phase37a-broader-actual-evidence-run.js

      # Phase 37B validator retained as historical reference; not run as Phase 37-uiA merge-blocking gate.
      # Validate Phase 37B Broader Actual Evidence Review
      # node scripts/validate-phase37b-broader-actual-evidence-review.js

      # Phase 37-uiA validator retained as historical reference; not run as Phase 37-uiB merge-blocking gate.
      # Validate Phase 37-uiA Dynamic Canvas Themes Scope Gate
      # node scripts/validate-phase37-uia-dynamic-canvas-themes-scope-gate.js

      # Phase 37-uiB validator retained as historical reference; not run as Phase 37-uiC merge-blocking gate.
      # Validate Phase 37-uiB Dynamic Canvas Theme Token Preview Pilot
      # node scripts/validate-phase37-uib-dynamic-canvas-theme-token-preview-pilot.js

      # Phase 37-uiC validator retained as historical reference; not run as Phase 37-uiD merge-blocking gate.
      # Validate Phase 37-uiC Dynamic Canvas Token Preview Evidence and Library Scope
      # node scripts/validate-phase37-uic-dynamic-canvas-token-preview-evidence-library-scope.js

      # Phase 37-uiD validator retained as historical reference; not run as Phase 37-uiE merge-blocking gate.
      # Validate Phase 37-uiD Library Shelf Modern Collection Cards Pilot
      # node scripts/validate-phase37-uid-library-shelf-modern-collection-cards-pilot.js

      # Phase 37-uiE validator retained as historical reference; not run as Phase 37-uiF merge-blocking gate.
      # Validate Phase 37-uiE Library Shelf Evidence and Study Room Scope
      # node scripts/validate-phase37-uie-library-shelf-evidence-study-room-scope.js

      # Phase 37-uiF validator retained as historical reference; not run as Phase 37-uiG merge-blocking gate.
      # Validate Phase 37-uiF Study Room Modern Answer Surface Pilot
      # node scripts/validate-phase37-uif-study-room-modern-answer-surface-pilot.js

      # Phase 37-uiG validator retained as historical reference; not run as Phase 37-uiH merge-blocking gate.
      # Validate Phase 37-uiG Study Room Evidence and Hybrid Navigation Scope
      # node scripts/validate-phase37-uig-study-room-evidence-hybrid-nav-scope.js

      # Phase 37-uiH validator retained as historical reference; not run as Phase 37-uiI merge-blocking gate.
      # Validate Phase 37-uiH Hybrid Sliding Navigation Indicator Pilot
      # node scripts/validate-phase37-uih-hybrid-sliding-navigation-indicator-pilot.js

      # Phase 37-uiI validator retained as historical reference; not run as Phase 37-uiJ merge-blocking gate.
      # Validate Phase 37-uiI Hybrid Nav Evidence and Elastic Tap Scope
      # node scripts/validate-phase37-uii-hybrid-nav-evidence-elastic-tap-scope.js

      # Phase 37-uiJ validator retained as historical reference; not run as Phase 37-uiK merge-blocking gate.
      # Validate Phase 37-uiJ Premium Elastic Tap Compression Token Pilot
      # node scripts/validate-phase37-uij-premium-elastic-tap-compression-token-pilot.js

      # Phase 37-uiK validator retained as historical reference; not run as Phase 37-uiL merge-blocking gate.
      # Validate Phase 37-uiK Elastic Tap Evidence and Streak Fire Scope
      # node scripts/validate-phase37-uik-elastic-tap-evidence-streak-fire-scope.js

      # Phase 37-uiL validator retained as historical reference; not run as Phase 37-uiM merge-blocking gate.
      # Validate Phase 37-uiL Streak Fire Ignition Micro-Moment Pilot
      # node scripts/validate-phase37-uil-streak-fire-ignition-micro-moment-pilot.js

      # Phase 37-uiM validator retained as historical reference; not run as Phase 37-uiN merge-blocking gate.
      # Validate Phase 37-uiM Streak Fire Evidence and Collapsible Avatar Header Scope
      # node scripts/validate-phase37-uim-streak-fire-evidence-collapsible-avatar-header-scope.js

      # Phase 37-uiN validator retained as historical reference; not run as Phase 37-uiO merge-blocking gate.
      # Validate Phase 37-uiN Collapsible Avatar Header Pilot
      # node scripts/validate-phase37-uin-collapsible-avatar-header-pilot.js

      # Phase 37-uiO validator retained as historical reference; not run as Phase 37-uiP merge-blocking gate.
      # Validate Phase 37-uiO Collapsible Avatar Header Evidence and UI Coherence Scope
      # node scripts/validate-phase37-uio-collapsible-avatar-header-evidence-ui-coherence-scope.js

      # Phase 37-uiP validator retained as historical reference; not run as Phase 37-uiQ merge-blocking gate.
      # Validate Phase 37-uiP UI Modernization Coherence Pass Pilot
      # node scripts/validate-phase37-uip-ui-modernization-coherence-pass-pilot.js

      # Phase 37-uiQ validator retained as historical reference; not run as Phase 37-uiR merge-blocking gate.
      # Validate Phase 37-uiQ UI Modernization Coherence Evidence and Backlog Closure Scope
      # node scripts/validate-phase37-uiq-ui-modernization-coherence-evidence-backlog-closure-scope.js

      # Phase 37-uiR validator retained as historical reference; not run as Phase 37-uiS merge-blocking gate.
      # Validate Phase 37-uiR UI Backlog Closure and Dynamic Canvas Design Gate
      # node scripts/validate-phase37-uir-ui-backlog-closure-dynamic-canvas-design-gate.js

      # Phase 37-uiS validator retained as historical reference; not run as Phase 37-uiT merge-blocking gate.
      # Validate Phase 37-uiS Dynamic Canvas Themes Design Gate
      # node scripts/validate-phase37-uis-dynamic-canvas-themes-design-gate.js

      # Phase 37-uiT validator retained as historical reference; not run as Phase 37-uiU merge-blocking gate.
      # Validate Phase 37-uiT Dynamic Canvas Themes Single-Surface Scope Gate
      # node scripts/validate-phase37-uit-dynamic-canvas-themes-single-surface-scope-gate.js

      # Phase 37-uiU validator retained as historical reference; not run as Phase 37-uiV merge-blocking gate.
      # Validate Phase 37-uiU Dynamic Canvas Themes Single-Surface Preview Pilot
      # node scripts/validate-phase37-uiu-dynamic-canvas-themes-single-surface-preview-pilot.js

      # Phase 37-uiV validator retained as historical reference; not run as Phase 37-uiW merge-blocking gate.
      # Validate Phase 37-uiV Dynamic Canvas Single-Surface Evidence and UI Proposal Completion
      # node scripts/validate-phase37-uiv-dynamic-canvas-single-surface-evidence-proposal-completion.js

      # Phase 37-uiW validator retained as historical reference; not run as Phase 37C merge-blocking gate.
      # Validate Phase 37-uiW UI Proposal Completion and Handoff
      # node scripts/validate-phase37-uiw-ui-proposal-completion-and-handoff.js

      # Phase 37C validator retained as historical reference; not run as Phase 37D merge-blocking gate.
      # Validate Phase 37C Limited Release Readiness Gap Review Return
      # node scripts/validate-phase37c-limited-release-readiness-gap-review-return.js

      # Phase 37D validator retained as commented historical reference only; not run as Phase 37E merge-blocking gate.
      # Validate Phase 37D Limited Release Evidence Action Plan
      # node scripts/validate-phase37d-limited-release-evidence-action-plan.js

      # Phase 37E validator retained as commented historical reference only; not run as Phase 37F merge-blocking gate.
      # Validate Phase 37E Manual Readiness Evidence Collection
      # node scripts/validate-phase37e-manual-readiness-evidence-collection.js

      - name: Validate Phase 37F Limited Release Evidence Review
        env:
          PHASE36H_HISTORICAL_WORKFLOW_REFERENCE_FOR_LEGACY_STATIC_TEST: |
            run: node scripts/validate-phase36h-core-interactive-focus-visible-consistency-pilot.js
        run: |
          node scripts/validate-phase37f-limited-release-evidence-review.js

      - name: Build app
        run: npm run build

      - name: Run Vitest unit tests
        run: npm run test:unit

      - name: Validate smoke fixture
        run: node scripts/validate-smoke-fixture.js

      # Historical Phase 15/16 audit references retained for legacy workflow-registration tests.
      # These are intentionally not run by the default e2e-smoke PR gate.
      # node scripts/validate-phase15e-controlled-internal-activation-harness.js
      # node scripts/validate-phase15f-studyroom-copy-ux-alignment.js
      # node scripts/validate-phase15h-fsrs-foundation-closure-phase16-readiness.js
      # node scripts/validate-phase16a-vietnamese-first-ux-copy-alignment.js
      # node scripts/validate-phase16b-hybrid-local-first-optional-sync-direction.js
      # node scripts/validate-phase16c-storage-large-import-edugen-risk-audit.js
      # node scripts/validate-phase16d-shime-study-identity-product-principles.js
      # node scripts/validate-phase16e-visual-polish-quick-wins.js
      # node scripts/validate-phase16f-edugen-draft-workshop-connector-foundation.js
      # node scripts/validate-phase16g-edugen-draft-review-import-flow.js
      # node scripts/validate-phase16h-edugen-draft-quality-review-source-aware-library.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke
        run: npm run test:e2e:smoke

      - name: Run onboarding E2E smoke
        run: npm run test:e2e:onboarding

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
